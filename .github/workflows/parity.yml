name: Upstream parity

on:
  pull_request:
    paths:
      - '.github/workflows/parity.yml'
      - 'scratch/parity_check.py'
      - 'src/DeltaZulu.Parse/Parsers/**'
      - 'src/DeltaZulu.Parse/PdagBuilder.cs'
      - 'src/DeltaZulu.Parse/PdagCompiler.cs'
      - 'src/DeltaZulu.Parse/PdagWalker.cs'
      - 'src/tools/LogNormalizer.Cli/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/parity.yml'
      - 'scratch/parity_check.py'
      - 'src/DeltaZulu.Parse/Parsers/**'
      - 'src/DeltaZulu.Parse/PdagBuilder.cs'
      - 'src/DeltaZulu.Parse/PdagCompiler.cs'
      - 'src/DeltaZulu.Parse/PdagWalker.cs'
      - 'src/tools/LogNormalizer.Cli/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: C reference implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeltaZulu.Parse
        uses: actions/checkout@v7

      # The expected output is deliberately generated by the independent C
      # implementation rather than stored in (and graded by) this repository.
      - name: Checkout upstream liblognorm
        uses: actions/checkout@v7
        with:
          repository: rsyslog/liblognorm
          path: upstream/liblognorm

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install liblognorm build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libestr-dev libfastjson-dev libtool pkg-config

      - name: Build C reference implementation
        working-directory: upstream/liblognorm
        run: |
          autoreconf --force --install
          ./configure --enable-testbench --prefix="$RUNNER_TEMP/liblognorm"
          make --jobs="$(nproc)"
          make install

      - name: Build C# implementation and CLI
        run: |
          dotnet restore src/tools/LogNormalizer.Cli/LogNormalizer.Cli.csproj --locked-mode
          dotnet build src/tools/LogNormalizer.Cli/LogNormalizer.Cli.csproj --configuration Release --no-restore

      - name: Compare upstream fixture output
        run: |
          python3 scratch/parity_check.py \
            --tests-dir upstream/liblognorm/tests \
            --c-bin "$RUNNER_TEMP/liblognorm/bin/lognormalizer" \
            --c-libdir "$RUNNER_TEMP/liblognorm/lib" \
            --csharp-cli-dll src/tools/LogNormalizer.Cli/bin/Release/net10.0/lognormalizer.dll
